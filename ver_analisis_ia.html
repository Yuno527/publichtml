<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Habilidades Blandas - AICROOM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .analysis-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .score-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 15px;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .analysis-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .analysis-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .analysis-card.strong {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }

        .analysis-card.weak {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .card-icon {
            font-size: 3em;
            margin-bottom: 15px;
            color: #667eea;
        }

        .card-title {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card-content {
            font-size: 1.3em;
            color: #333;
            font-weight: bold;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            font-size: 1.2em;
        }

        .section-content {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.8;
            color: #555;
            font-size: 1.05em;
        }

        .recommendation-box {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border-radius: 15px;
            padding: 25px;
            border-left: 5px solid #f39c12;
        }

        .recommendation-box .section-title {
            color: #d35400;
        }

        .recommendation-box .section-content {
            background: rgba(255, 255, 255, 0.7);
            border-left: none;
            color: #333;
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .analysis-container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .analysis-grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5885LF4W"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
    <div class="analysis-container" id="analysisContainer">
        <div class="loading" id="loadingSection">
            <div class="spinner"></div>
            <p>Cargando análisis...</p>
        </div>

        <div id="analysisContent" style="display: none;">
            <div class="header">
                <h1><i class="fas fa-brain"></i> Análisis de Habilidades Blandas</h1>
                <p>Resultado de tu evaluación personalizada</p>
                <div class="score-badge" id="scoreBadge">Puntaje: <span id="totalScore">-</span></div>
            </div>

            <div class="analysis-grid">
                <div class="analysis-card strong">
                    <div class="card-icon">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="card-title">Habilidad Más Fuerte</div>
                    <div class="card-content" id="strongSkill">-</div>
                </div>

                <div class="analysis-card weak">
                    <div class="card-icon">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <div class="card-title">Habilidad a Mejorar</div>
                    <div class="card-content" id="weakSkill">-</div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">
                    <i class="fas fa-clipboard-list"></i> Análisis Profesional
                </div>
                <div class="section-content" id="analysisText">
                    Cargando análisis...
                </div>
            </div>

            <div class="section recommendation-box">
                <div class="section-title">
                    <i class="fas fa-lightbulb"></i> Recomendación
                </div>
                <div class="section-content" id="recommendationText">
                    Cargando recomendación...
                </div>
            </div>

            <div class="actions">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home"></i> Volver al Inicio
                </a>
                <button class="btn btn-secondary" onclick="window.print()">
                    <i class="fas fa-print"></i> Imprimir
                </button>
            </div>
        </div>
    </div>

    <script>
        // Función para parsear el análisis de la IA
        function parseAnalysis(analysisText) {
            const result = {
                strongSkill: '',
                weakSkill: '',
                analysis: '',
                recommendation: ''
            };

            if (!analysisText) {
                return result;
            }

            // Buscar "Habilidad más fuerte:"
            const strongMatch = analysisText.match(/habilidad\s+más\s+fuerte[:\s]+([^\n]+)/i);
            if (strongMatch) {
                result.strongSkill = strongMatch[1].trim();
            }

            // Buscar "Habilidad más débil:" o "Habilidad a mejorar:"
            const weakMatch = analysisText.match(/habilidad\s+más\s+débil[:\s]+([^\n]+)/i) ||
                             analysisText.match(/habilidad\s+a\s+mejorar[:\s]+([^\n]+)/i);
            if (weakMatch) {
                result.weakSkill = weakMatch[1].trim();
            }

            // Buscar "Análisis:"
            const analysisMatch = analysisText.match(/análisis[:\s]+([^\n]+(?:\n(?!recomendación)[^\n]+)*)/i);
            if (analysisMatch) {
                result.analysis = analysisMatch[1].trim();
            }

            // Buscar "Recomendación:"
            const recommendationMatch = analysisText.match(/recomendación[:\s]+(.+)/is);
            if (recommendationMatch) {
                result.recommendation = recommendationMatch[1].trim();
            }

            // Si no se encontraron las secciones, intentar dividir por líneas
            if (!result.strongSkill && !result.weakSkill) {
                const lines = analysisText.split('\n').filter(line => line.trim());
                if (lines.length >= 2) {
                    result.strongSkill = lines[0].replace(/^[^:]+:\s*/, '').trim();
                    result.weakSkill = lines[1].replace(/^[^:]+:\s*/, '').trim();
                }
            }

            return result;
        }

        // Función para mostrar el análisis
        function displayAnalysis(analysisData, totalScore) {
            const parsed = parseAnalysis(analysisData);

            // Mostrar puntaje
            if (totalScore !== null && totalScore !== undefined) {
                document.getElementById('totalScore').textContent = totalScore;
            }

            // Mostrar habilidades
            document.getElementById('strongSkill').textContent = parsed.strongSkill || 'No especificada';
            document.getElementById('weakSkill').textContent = parsed.weakSkill || 'No especificada';

            // Mostrar análisis
            const analysisText = parsed.analysis || analysisData;
            document.getElementById('analysisText').innerHTML = analysisText
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

            // Mostrar recomendación
            const recommendationText = parsed.recommendation || 'Continúa trabajando en tu desarrollo personal y profesional.';
            document.getElementById('recommendationText').innerHTML = recommendationText
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

            // Ocultar loading y mostrar contenido
            document.getElementById('loadingSection').style.display = 'none';
            document.getElementById('analysisContent').style.display = 'block';
        }

        // Obtener datos de la URL o localStorage
        window.addEventListener('DOMContentLoaded', function() {
            // Intentar obtener de URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const analysis = urlParams.get('analysis');
            const score = urlParams.get('score');

            if (analysis) {
                displayAnalysis(decodeURIComponent(analysis), score ? parseInt(score) : null);
            } else {
                // Intentar obtener de localStorage (si viene del chatbot)
                const storedAnalysis = localStorage.getItem('aiAnalysis');
                const storedScore = localStorage.getItem('totalScore');

                if (storedAnalysis) {
                    displayAnalysis(storedAnalysis, storedScore ? parseInt(storedScore) : null);
                    // Limpiar localStorage después de mostrar
                    localStorage.removeItem('aiAnalysis');
                    localStorage.removeItem('totalScore');
                } else {
                    // Mostrar error
                    document.getElementById('loadingSection').innerHTML = 
                        '<p style="color: #e74c3c;">No se encontró ningún análisis para mostrar.</p>' +
                        '<a href="index.html" class="btn btn-primary" style="margin-top: 20px;">Volver al Inicio</a>';
                }
            }
        });
    </script>
</body>
</html>
